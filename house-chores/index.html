<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EADE">
<title>Today's House Chores</title>
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="images/apple-touch-icon.png">
<style>
:root{--blue:#2988BC;--sea:#2F496E;--plaster:#F4EADE;--coral:#ED8C72;--ink:#31465e;--line:#d8c9b7;--white:#fffaf4}
*{box-sizing:border-box}html{width:100%;overflow-x:hidden}
body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--plaster);color:var(--sea);font-family:"Avenir Next",Avenir,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh;padding:26px 16px 50px;background-image:radial-gradient(#2f496e0b .8px,transparent .8px);background-size:8px 8px}
.app{width:100%;max-width:680px;margin:0 auto}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-family:"Trebuchet MS",sans-serif;font-weight:900;font-size:clamp(15px,3vw,19px);letter-spacing:.055em;color:var(--sea);line-height:1.05}.brand span{display:block;color:var(--coral);font-size:.62em;letter-spacing:.17em;margin-top:4px}
.header-sun{width:59px;height:59px;color:var(--coral);opacity:.9;flex:none}
.date-card{position:relative;display:flex;align-items:center;justify-content:center;min-height:124px;width:100%;border:1.5px solid var(--line);border-radius:22px;background:var(--white);box-shadow:0 5px 0 #2f496e0b;overflow:hidden}
.date{font-size:clamp(22px,5vw,30px);font-weight:700;letter-spacing:.03em;text-align:center}.date small{display:block;color:var(--coral);font-size:13px;letter-spacing:.19em;margin-bottom:7px}.date .weekday{font-size:.58em;color:var(--sea);margin-left:8px}
.doodle{position:absolute;color:var(--sea);width:66px;height:66px;opacity:.88}.doodle.left{left:5%;transform:rotate(-8deg)}.doodle.right{right:5%;transform:rotate(7deg)}
.summary{margin:22px 0 19px;text-align:center}.total-label{font-size:13px;letter-spacing:.17em;color:#7d8e99}.total{font-size:15px;margin-top:2px}.total strong{font-size:36px;line-height:1;color:var(--blue);font-weight:500;vertical-align:-3px;margin:0 4px 0 7px}
.progress-wrap{position:relative;height:56px;margin-top:16px}.progress-track{height:14px;width:100%;overflow:hidden;border-radius:99px;background:var(--coral);box-shadow:inset 0 1px 2px #2f496e22;transition:opacity .75s ease,transform .75s ease}.progress-fill{height:100%;width:0;border-radius:inherit;background:var(--blue);transition:width .55s cubic-bezier(.22,1,.36,1)}
.progress-labels{display:flex;justify-content:space-between;margin-top:6px;color:#778994;font-size:11px;letter-spacing:.04em;transition:opacity .7s ease,transform .7s ease}.progress-labels .finished{color:var(--blue)}.progress-labels .remaining{color:var(--coral)}
.completion{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s ease .24s}.complete-word{display:flex;align-items:center;justify-content:center;gap:9px;padding-top:0}.completion strong{color:var(--blue);font-size:23px;letter-spacing:.08em;animation:none}.sparkle{width:20px;height:20px;color:var(--coral);opacity:.95;flex:none}.completion small{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:3px;color:#798a94;font-size:12px;letter-spacing:.08em}.tea-icon{width:17px;height:17px;color:var(--sea)}.bonus-scene{position:absolute;left:0;right:0;top:0;height:56px;display:block;pointer-events:none;overflow:visible}.bonus-art{position:absolute;top:0;height:54px;object-fit:contain;animation:bonus-pop .65s ease-out both}.bonus-art.bird{left:1%;width:58px}.bonus-art.cat{right:1%;width:72px}.bonus-art.dog{right:0;width:91px}@keyframes bonus-pop{from{opacity:0;transform:translateY(7px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes bird-fly{0%{opacity:0;transform:translate(-115px,15px) scale(.8)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(105px,-12px) scale(1.05)}}
.summary.is-complete .progress-track,.summary.is-complete .progress-labels{opacity:0;transform:translateY(-4px);pointer-events:none}.summary.is-complete .completion{opacity:1;visibility:visible;animation:completion-rise 4.1s ease-in-out both}.summary.is-complete .completion strong{animation:completion-shine 4.1s ease-in-out both}.summary.is-complete .completion small{animation:completion-fade 4.1s ease-in-out both}.summary.is-complete .sparkle{animation:completion-sparkle 4.1s ease-in-out both}.summary.is-complete .sparkle.right{animation-delay:.32s}
.list{width:100%;min-width:0;background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:8px 18px 14px;box-shadow:0 6px 0 #2f496e0b}.optional-list{margin-top:18px;background:#fffaf4b8}.list-head{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 9px;border-bottom:1px dashed var(--line);font-size:12px;letter-spacing:.12em;color:#7d8e99}.optional-list .list-head{color:var(--sea);font-size:14px;letter-spacing:.05em}
.task{display:flex;align-items:center;gap:11px;min-height:48px;padding:5px 0;border-bottom:1px solid #eee4d9;animation:appear .2s ease-out;min-width:0}.task:last-of-type{border-bottom:0}
.check{appearance:none;-webkit-appearance:none;width:21px;height:21px;flex:none;border:1.5px solid #9eafba;border-radius:7px;background:transparent;cursor:pointer;position:relative}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked:after{content:"✓";position:absolute;color:white;font-size:15px;left:3px;top:-1px}
.task-name{flex:1;min-width:0;border:0;background:transparent;color:var(--sea);font:500 16px inherit;font-size:16px;padding:6px 2px;outline:none;overflow-wrap:anywhere}.task-name:focus{border-bottom:1px solid var(--blue);background:#2988bc0a}.task.done .task-name{text-decoration:line-through;color:#9aa6ad}
.icon-btn{border:0;background:transparent;color:#8a9aa4;cursor:pointer;font-size:17px;width:31px;height:32px;flex:none;border-radius:8px}.icon-btn:hover{background:#f4eadf;color:var(--sea)}.icon-btn.delete:hover{color:#cf6657}
.add-row{display:flex;gap:9px;width:100%;align-items:center;text-align:left;border:1px dashed #cdbca8;border-radius:12px;background:transparent;color:var(--blue);padding:11px 12px;margin-top:12px;font:600 14px inherit;cursor:pointer}.add-row:hover{background:#2988bc0a}.plus{font-size:20px;line-height:12px}
.foot{display:flex;align-items:center;justify-content:center;gap:8px;color:#9c9287;font-size:11px;margin-top:15px;letter-spacing:.06em}.tiny-spark{color:var(--coral);font-family:Georgia,serif;font-size:19px;line-height:1}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes completion-rise{from{opacity:0;transform:translateY(9px)}35%,82%{opacity:1;transform:none}to{opacity:1}}@keyframes completion-shine{from{opacity:0;transform:scale(.82)}38%,82%{opacity:1;transform:scale(1)}90%{transform:scale(1.04)}to{opacity:1}}@keyframes completion-fade{0%,30%{opacity:0;transform:translateY(4px)}47%,100%{opacity:1;transform:none}}@keyframes completion-sparkle{0%,30%{opacity:0;transform:scale(.4) rotate(0)}48%,79%{opacity:1;transform:scale(1) rotate(30deg)}to{opacity:.8;transform:scale(.82) rotate(55deg)}}
@media(max-width:480px){body{padding:18px 12px 34px}.topline{margin-bottom:14px}.date-card{min-height:108px}.doodle{width:49px;height:49px}.doodle.left{left:3%}.doodle.right{right:3%}.list{padding:5px 13px 12px}.task{gap:8px;min-height:47px}.icon-btn{width:28px}}
</style>
</head>
<body>
<main class="app">
<header class="topline"><div class="brand">TODAY'S<br>HOUSE CHORES<span>a little at a time</span></div><svg class="header-sun" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="太陽"><circle cx="32" cy="32" r="12"/><path d="M32 5v7M32 52v7M5 32h7M52 32h7M13 13l5 5M46 46l5 5M51 13l-5 5M18 46l-5 5"/></svg></header>
<section class="date-card" aria-label="今日の日付">
<svg class="doodle left" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="洗濯機"><rect x="14" y="10" width="52" height="61" rx="5"/><path d="M15 25h50M22 18h2m6 0h2"/><circle cx="40" cy="48" r="16"/><circle cx="40" cy="48" r="11"/><path d="M31 48c3-4 7-5 12-2 2 1 4 1 6 0M34 56c3 2 8 2 12-1"/><path d="M18 12c2-2 3 1 5-1"/></svg>
<div class="date"><small>TODAY</small><span id="dateText"></span><span class="weekday" id="weekday"></span></div>
<svg class="doodle right" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="鍋"><path d="M16 39v18c0 9 9 14 24 14s24-5 24-14V39"/><path d="M16 45h-4c-7 0-7 10 0 10h4M64 45h4c7 0 7 10 0 10h-4"/><path d="M17 38c4-7 10-10 17-11"/><path d="M46 27c7 1 13 4 17 11"/><path d="M34 30 Q40 33 46 30"/><path d="M17 38c12 5 34 5 46 0"/><path d="M34 30v-3c0-3 12-3 12 0v3"/><path d="M30 22c-2-4 0-7 2-9M44 22c-2-4 0-7 2-9"/></svg></section>
<section class="summary" id="summary" aria-live="polite"><div class="total-label">今日の家事</div><div class="total"><strong id="totalCount">0</strong>件</div><div class="progress-wrap">
<div class="progress-track" id="progressTrack" role="progressbar" aria-label="今日の家事の進捗" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><div class="progress-labels"><span class="finished">終わった✨</span><span class="remaining">これから👀</span></div>
<div class="completion"><div class="bonus-scene" id="bonusScene" aria-hidden="true"></div><div class="complete-word"><svg class="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.2c.65 5.2 3.05 7.6 8.25 8.25-5.2.65-7.6 3.05-8.25 8.25-.65-5.2-3.05-7.6-8.25-8.25C8.95 9.8 11.35 7.4 12 2.2Z"/></svg><strong>完了</strong><svg class="sparkle right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.2c.65 5.2 3.05 7.6 8.25 8.25-5.2.65-7.6 3.05-8.25 8.25-.65-5.2-3.05-7.6-8.25-8.25C8.95 9.8 11.35 7.4 12 2.2Z"/></svg></div><small>おつかれさまでした <svg class="tea-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11v6c0 2-2 3-5.5 3S3 16 3 14zM14 10h2c2 0 2 4 0 4h-2M5 6c1-1 0-2 1-3M9 6c1-1 0-2 1-3"/><path d="M2 18h13"/></svg></small></div></div></section>
<section class="list"><div class="list-head"><span>今日のリスト</span><span id="listDay"></span></div><div id="tasks"></div><button class="add-row" id="addTask" type="button"><span class="plus">＋</span> 家事を追加する</button></section>
<section class="list optional-list"><div class="list-head"><span>これもやっとく？ 👀</span></div><div id="optionalTasks"></div></section>
<div class="foot"><span class="tiny-spark" aria-hidden="true">＊</span>できるところから、ひとつずつ</div>
</main>
<script>
(()=>{
const daily=['食洗機','シャツ洗濯','毛布洗う','タオル洗濯','洗濯たたむ','ダイソン','炊飯器洗う','米炊く','夕飯作る','燃えるゴミ出す'];
const weekend=['トイレ掃除','クイックルワイパー','手洗い洗濯'];
const optional=['キッチン流し掃除','洗面台掃除','洗面台鏡掃除','お風呂カビ取り'];
const key='todays-house-chores-v1';let state,today,wasComplete=false;
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isWeekend=d=>d.getDay()===0||d.getDay()===6;
const isRecyclingDay=d=>d.getDay()===4&&Math.ceil(d.getDate()/7)%2===0;
const makeTasks=(names,prefix)=>names.map((name,i)=>({id:`${prefix}-${Date.now()}-${i}`,name,done:false}));
function base(){const d=new Date();return makeTasks([...daily,...(isWeekend(d)?weekend:[]),...(isRecyclingDay(d)?['リサイクルゴミ出す']:[])],'task')}
function baseOptional(){return makeTasks(optional,'optional')}
function ensureTodayTasks(){const d=new Date();const required=['燃えるゴミ出す',...(isRecyclingDay(d)?['リサイクルゴミ出す']:[])];required.forEach(name=>{if(!state.tasks.some(task=>task.name===name))state.tasks.push({id:`task-${Date.now()}-${Math.random()}`,name,done:false})});if(!Array.isArray(state.optionalTasks))state.optionalTasks=baseOptional()}
function load(){today=dateKey(new Date());try{const saved=JSON.parse(localStorage.getItem(key));state=saved?.date===today&&Array.isArray(saved.tasks)?saved:{date:today,tasks:base(),optionalTasks:baseOptional()}}catch{state={date:today,tasks:base(),optionalTasks:baseOptional()}}ensureTodayTasks();save()}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function renderDate(){const d=new Date();document.querySelector('#dateText').textContent=`${d.getMonth()+1}月${d.getDate()}日`;document.querySelector('#weekday').textContent=['日','月','火','水','木','金','土'][d.getDay()]+'曜日';document.querySelector('#listDay').textContent=isWeekend(d)?'WEEKEND':'WEEKDAY'}
function sortTasks(){state.tasks.sort((a,b)=>a.done===b.done?0:a.done?1:-1)}
function basicRow(task,isPrimary=false){const row=document.createElement('div');row.className='task'+(task.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!task.done;check.setAttribute('aria-label',`${task.name}を完了`);check.onchange=()=>{task.done=check.checked;if(isPrimary)sortTasks();save();render()};const label=document.createElement('span');label.className='task-name';label.textContent=task.name;row.append(check,label);return row}

function render(){renderDate();sortTasks();const host=document.querySelector('#tasks');host.replaceChildren();state.tasks.forEach((task,index)=>{const row=basicRow(task,true);const label=row.querySelector('.task-name');label.contentEditable='true';label.setAttribute('role','textbox');label.setAttribute('aria-label','家事の名前');label.dataset.taskId=task.id;label.onblur=()=>{const newName=label.textContent.trim()||'名前のない家事';if(task.name!==newName){task.name=newName;save()}};label.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();label.blur()}};const copy=document.createElement('button');copy.className='icon-btn';copy.type='button';copy.title='複製';copy.setAttribute('aria-label',`${task.name}を複製`);copy.textContent='⧉';copy.onclick=()=>{state.tasks.splice(index+1,0,{id:`${Date.now()}-${Math.random()}`,name:task.name,done:false});save();render()};const del=document.createElement('button');del.className='icon-btn delete';del.type='button';del.title='削除';del.setAttribute('aria-label',`${task.name}を削除`);del.textContent='⌫';del.onclick=()=>{state.tasks.splice(index,1);save();render()};row.append(copy,del);host.append(row)});const optionalHost=document.querySelector('#optionalTasks');optionalHost.replaceChildren();state.optionalTasks.forEach(task=>optionalHost.append(basicRow(task)));const done=state.tasks.filter(t=>t.done).length,total=state.tasks.length,complete=total>0&&done===total;document.querySelector('#totalCount').textContent=total;document.querySelector('#progressFill').style.width=`${total?done/total*100:0}%`;const track=document.querySelector('#progressTrack');track.setAttribute('aria-valuemax',total);track.setAttribute('aria-valuenow',done);track.setAttribute('aria-valuetext',`${total}件中${done}件完了`);if(complete&&!wasComplete)showBonusScene();if(!complete)document.querySelector('#bonusScene').replaceChildren();wasComplete=complete;document.querySelector('#summary').classList.toggle('is-complete',complete)}
document.querySelector('#addTask').onclick=()=>{const newTask={id:`${Date.now()}-${Math.random()}`,name:'新しい家事',done:false};const firstDone=state.tasks.findIndex(task=>task.done);if(firstDone===-1)state.tasks.push(newTask);else state.tasks.splice(firstDone,0,newTask);save();render();const label=document.querySelector(`#tasks .task-name[data-task-id="${CSS.escape(newTask.id)}"]`);if(label){label.focus();const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(label);selection.removeAllRanges();selection.addRange(range)}};
function rollover(){const next=dateKey(new Date());if(next!==today){load();render()}}
load();render();setInterval(rollover,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)rollover()});
})();
</script>
