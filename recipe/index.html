  :root {
    --mint: #B3DBC0;
    --red: #FE0000;
    --porcelain: #FDF6F6;
    --blue: #67BACA;
    --text: #666666;
    --dark-text: #555555;
    --white: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 10%, rgba(103,186,202,.18) 0 35px, transparent 36px),
      radial-gradient(circle at 90% 18%, rgba(254,0,0,.08) 0 28px, transparent 29px),
      var(--porcelain);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  }

  .app {
    width: min(100%, 760px);
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  /* インデックスをMY RECIPE BOOKの直下に置き、カードとぴったり接続 */
  .app-page > header {
    margin-bottom: 20px;
  }

  .app-page > .app-nav {
    margin-bottom: -2px;
  }

  .logo {
    display: inline-block;
    padding: 10px 24px 12px;
    background: var(--red);
    color: white;
    border-radius: 999px;
    font-family: "Honey", cursive;
    font-size: clamp(24px, 7vw, 38px);
    letter-spacing: .5px;
    transform: rotate(-2deg);
    box-shadow: 4px 4px 0 rgba(103,186,202,.35);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .kitchen-icon {
    width: 78px;
    height: 38px;
    flex: 0 0 auto;
    color: rgba(255,255,255,.96);
  }


  .card {
    background: rgba(255,255,255,.92);
    border: 3px solid var(--mint);
    border-radius: 28px;
    padding: 24px 20px;
    box-shadow: 7px 7px 0 rgba(103,186,202,.22);
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 14px;
    color: var(--dark-text);
    font-family: "Honey", cursive;
    font-size: 23px;
  }

  .section-title.preference-title {
    font-size: 14px;
  }

  .section-title.preference-title .section-icon {
    width: 34px;
    height: 34px;
  }

  .section-icon {
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    color: #666;
  }

  .section-icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .field {
    margin-bottom: 20px;
  }

  label,
  .field-label {
    display: block;
    margin-bottom: 7px;
    font-weight: 700;
    color: var(--dark-text);
    font-size: 14px;
  }

  .required {
    color: var(--red);
    font-size: 11px;
    margin-left: 4px;
  }

  input[type="text"],
  input[type="url"],
  textarea {
    width: 100%;
    border: 2px solid #d9e9df;
    border-radius: 15px;
    padding: 13px 14px;
    background: #fff;
    color: var(--text);
    font: inherit;
    outline: none;
    transition: .2s;
  }

  textarea {
    min-height: 110px;
    resize: vertical;
  }

  input:focus,
  textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(103,186,202,.14);
  }

  .hint {
    margin-top: 6px;
    color: #999;
    font-size: 11px;
  }

  .radio-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .choice {
    position: relative;
  }

  .choice input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .choice span {
    display: block;
    padding: 9px 14px;
    border: 2px solid #d9e9df;
    border-radius: 999px;
    background: #fff;
    color: #777;
    cursor: pointer;
    font-size: 13px;
    transition: .18s;
  }

  .choice input:checked + span {
    border-color: var(--blue);
    background: #e9f7fa;
    color: #4d8f9c;
    font-weight: 700;
  }

  .family-box {
    margin-top: 8px;
    padding: 16px;
    border-radius: 20px;
    background: #f7fbf8;
    border: 2px dashed #c6dfcf;
  }

  .family-row {
    display: grid;
    grid-template-columns: 88px 1fr;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dotted #d5dfd8;
  }

  .family-row:last-child {
    border-bottom: none;
  }

  .family-name {
    font-weight: 700;
    color: var(--dark-text);
    font-size: 13px;
  }

  .rating-row {
    display: flex;
    gap: 7px;
  }

  .rating {
    position: relative;
  }

  .rating input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .rating span {
    width: 38px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 2px solid #d9e9df;
    border-radius: 11px;
    background: white;
    color: #888;
    cursor: pointer;
    font-weight: 700;
    transition: .18s;
  }

  .rating input:checked + span {
    border-color: var(--blue);
    background: #e9f7fa;
    color: #4d8f9c;
  }

  .divider {
    height: 1px;
    background: #e6eee9;
    margin: 22px 0;
  }

  .register-button {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 15px 18px;
    background: var(--red);
    color: white;
    font-family: "Honey", cursive;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #c80000;
    transition: .12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .register-button-icon {
    width: 58px;
    height: 32px;
    flex: 0 0 auto;
  }

  .register-button:hover {
    transform: translateY(-1px);
  }

  .register-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #c80000;
  }

  .success {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #eef9f1;
    color: #5b8567;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
  }

  @media (max-width: 520px) {
    .app {
      padding: 18px 12px 36px;
    }

    .card {
      padding: 20px 15px;
      border-radius: 23px;
    }

    .family-row {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .family-name {
      margin-bottom: 2px;
    }
  }

  /* Retro kitchen side stripes */
  body::before,
  body::after {
    content: "";
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    width: 40px;
    background: #67BACA;
  }

  body::after {
    left: 40px;
    width: 30px;
    background: #B3DBC0;
  }

  .app {
    position: relative;
    z-index: 1;
  }

  @media (max-width: 520px) {
    body::before { width: 40px; }
    body::after { left: 40px; width: 30px; }
  }


  .section-title,
  .field-label,
  label,
  .register-button,
  .hint,
  .family-name,
  .choice span,
  input,
  textarea {
    font-family: "メイリオ", Meiryo, sans-serif;
  }





  .app-nav {
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 5px;
    margin: 0 0 -2px 12px;
    position: relative;
    z-index: 3;
  }

  .nav-button {
    appearance: none;
    border: 2px solid var(--mint);
    border-bottom: 0;
    background: #fff;
    color: #6b7770;
    border-radius: 13px 13px 0 0;
    padding: 9px 14px 8px;
    min-width: 112px;
    font-family: "メイリオ", Meiryo, sans-serif;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    box-shadow: 2px -1px 0 rgba(103,186,202,.14);
  }

  .nav-button.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
    padding-top: 11px;
  }

  .app-page .card {
    position: relative;
    z-index: 2;
  }

  .app-page { display: none; }
  .app-page.active { display: block; }

  .list-page .card { padding-bottom: 22px; }

  .list-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .list-heading-left {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .list-heading-icon {
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
  }

  .list-heading-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .list-heading h2 {
    margin: 0;
    font-family: "メイリオ", Meiryo, sans-serif;

<script>
/*
  MY RECIPE BOOK v6
  - データ保存をIndexedDBに変更
  - IndexedDBが使えない環境ではlocalStorageへ自動フォールバック
  - 旧v5のlocalStorageデータがあれば初回起動時にIndexedDBへ移行
*/
const STORAGE_KEY = "my_recipe_book";
const DB_NAME = "my_recipe_book_db";
const DB_VERSION = 1;
const STORE_NAME = "recipes";
let activeFilter = "all";
let dbPromise = null;

const registerPage = document.getElementById("registerPage");
const listPage = document.getElementById("listPage");
const form = document.getElementById("recipeForm");
const successMessage = document.getElementById("successMessage");

function localStorageLoadRecipes() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (error) {
    console.error("localStorageの読み込みに失敗しました。", error);
    return [];
  }
}

function localStorageSaveRecipes(recipes) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
}

function indexedDBAvailable() {
  return typeof indexedDB !== "undefined";
}

function openDB() {
  if (!indexedDBAvailable()) return Promise.reject(new Error("IndexedDBが利用できません。"));
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = event => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };

    request.onsuccess = event => resolve(event.target.result);
    request.onerror = () => reject(request.error || new Error("IndexedDBを開けませんでした。"));
  });

  return dbPromise;
}

function indexedDBGetAll() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const request = tx.objectStore(STORE_NAME).getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  }));
}

function indexedDBPutAll(recipes) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);
    store.clear();
    recipes.forEach(recipe => store.put(recipe));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("IndexedDBへの保存に失敗しました。"));
    tx.onabort = () => reject(tx.error || new Error("IndexedDBへの保存が中断されました。"));
  }));
}

async function loadRecipes() {
  try {
    const recipes = await indexedDBGetAll();

    // 初回だけ、旧v5のlocalStorageデータをIndexedDBへ移す
    if (recipes.length === 0) {
      const oldRecipes = localStorageLoadRecipes();
      if (oldRecipes.length > 0) {
        await indexedDBPutAll(oldRecipes);
        return oldRecipes;
      }
    }

    return recipes;
  } catch (error) {
    console.warn("IndexedDBを利用できないためlocalStorageへ切り替えます。", error);
    return localStorageLoadRecipes();
  }
}

async function saveRecipes(recipes) {
  try {
    await indexedDBPutAll(recipes);
    return;
  } catch (error) {
    console.warn("IndexedDBへの保存に失敗したためlocalStorageへ切り替えます。", error);
  }

  try {
    localStorageSaveRecipes(recipes);
  } catch (error) {
    console.error("レシピの保存に失敗しました。", error);
    throw new Error("レシピを保存できませんでした。ブラウザの設定をご確認ください。");
  }
}

function todayISO() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function showPage(pageId) {
  document.querySelectorAll(".app-page").forEach(page => {
    page.classList.toggle("active", page.id === pageId);
  });

  document.querySelectorAll(".nav-button").forEach(button => {
    button.classList.toggle("active", button.dataset.page === pageId);
  });

  if (pageId === "listPage") renderList();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll(".nav-button").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const recipes = await loadRecipes();
  const recipe = {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
    name: document.getElementById("recipeName").value.trim(),
    url: document.getElementById("recipeUrl").value.trim(),
    memo: document.getElementById("recipeMemo").value.trim(),
    cookPerson: document.querySelector('input[name="cookPerson"]:checked')?.value || "",
    ratings: {
      kaori: document.querySelector('input[name="kaori"]:checked')?.value || "",
      takamitsu: document.querySelector('input[name="takamitsu"]:checked')?.value || "",
      kotaro: document.querySelector('input[name="kotaro"]:checked')?.value || "",
      yamato: document.querySelector('input[name="yamato"]:checked')?.value || ""
    },
    cookingHistory: [todayISO()]
  };

  recipes.push(recipe);

  try {
    await saveRecipes(recipes);
  } catch (error) {
    successMessage.textContent = "⚠️ 保存できませんでした。もう一度お試しください。";
    successMessage.style.display = "block";
    return;
  }

  form.reset();
  successMessage.textContent = "✨ レシピを登録しました！";
  successMessage.style.display = "block";

  // 登録完了後はすぐ一覧へ
  showPage("listPage");
});

function parseISODate(value) {
  if (!value) return null;
  const parts = value.split("-").map(Number);
  if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function daysSince(value) {
  const date = parseISODate(value);
  if (!date) return null;
  const today = parseISODate(todayISO());
  return Math.floor((today - date) / 86400000);
}

function latestDate(recipe) {
  const history = Array.isArray(recipe.cookingHistory) ? recipe.cookingHistory : [];
  if (history.length) return [...history].sort().at(-1);
  return recipe.latestCookingDate || "";
}

function cookingCount(recipe) {
  if (Array.isArray(recipe.cookingHistory)) return recipe.cookingHistory.length;
  return Number(recipe.cookingCount || 0);
}

function formatDate(value) {
  if (!value) return "未記録";
  const parts = value.split("-");
  return parts.length === 3 ? `${parts[0]}/${parts[1]}/${parts[2]}` : value;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function sortRecipes(recipes) {
  return [...recipes].sort((a, b) => {
    const da = daysSince(latestDate(a));
    const db = daysSince(latestDate(b));
    return (db ?? -1) - (da ?? -1);
  });
}

function ratingPill(label, value) {
  return `<span class="rating-pill ${value ? "" : "empty"}">${label} ${value || "—"}</span>`;
}

async function renderList() {
  const list = document.getElementById("recipeList");
  list.innerHTML = `<div class="empty-list"><div class="empty-list-title">読み込み中…👀</div></div>`;

  const allRecipes = await loadRecipes();
  let recipes = sortRecipes(allRecipes);

  if (activeFilter === "stale") {
    recipes = recipes.filter(recipe => {
      const days = daysSince(latestDate(recipe));
      return days !== null && days >= 30;
    });
  }

  document.getElementById("recipeCount").textContent = `${recipes.length}件`;

  if (!recipes.length) {
    list.innerHTML = `
      <div class="empty-list">
        <div class="empty-list-heart">♥</div>
        <div class="empty-list-title">${
          activeFilter === "stale"
            ? "まだ「そろそろ」の料理はありません✨"
            : "まだレシピがありません"
        }</div>
        <p class="empty-list-text">${
          activeFilter === "stale"
            ? "30日以上作っていないレシピが出てきたら、ここに並びます👀"
            : "「また作りたい」と思った料理を登録していきましょう🍳"
        }</p>
        ${activeFilter === "all" ? '<button class="go-register" type="button">＋ レシピを登録</button>' : ""}
      </div>
    `;

    const goRegister = list.querySelector(".go-register");
    if (goRegister) goRegister.addEventListener("click", () => showPage("registerPage"));
    return;
  }

  list.innerHTML = recipes.map(recipe => {
    const latest = latestDate(recipe);
    const days = daysSince(latest);
    const stale = days !== null && days >= 30;
    const ratings = recipe.ratings || {};
    const today = todayISO();
    const cookedToday = Array.isArray(recipe.cookingHistory) && recipe.cookingHistory.includes(today);

    return `
      <article class="recipe-card">
        <div class="recipe-top">
          <h3 class="recipe-name">${escapeHtml(recipe.name || "名前なし")}</h3>
          ${stale ? `<span class="sleep-badge">💤 ${days}日作ってない</span>` : ""}
        </div>

        <div class="recipe-meta">
          <span>🍳 <strong>${cookingCount(recipe)}回</strong> 作った</span>
          <span>最新：<strong>${formatDate(latest)}</strong></span>
          ${recipe.cookPerson ? `<span>つくる人：<strong>${escapeHtml(recipe.cookPerson)}</strong></span>` : ""}
        </div>

        <div class="ratings">
          ${ratingPill("かおり", ratings.kaori)}
          ${ratingPill("たかみつ", ratings.takamitsu)}
          ${ratingPill("こたろう", ratings.kotaro)}
          ${ratingPill("やまと", ratings.yamato)}
        </div>

        <button class="cook-button ${cookedToday ? "done" : ""}" type="button" data-action="cook" data-id="${escapeHtml(recipe.id)}">
          ${cookedToday ? "✓ 今日作った" : "作った🧑‍🍳✨"}
        </button>
      </article>
    `;
  }).join("");
}

async function cookRecipe(id) {
  const recipes = await loadRecipes();
  const recipe = recipes.find(item => item.id === id);
  if (!recipe) return;

  if (!Array.isArray(recipe.cookingHistory)) recipe.cookingHistory = [];

  const today = todayISO();

  if (recipe.lastCookButtonAction?.date === today && recipe.lastCookButtonAction.added) {
    const index = recipe.cookingHistory.lastIndexOf(today);
    if (index >= 0) recipe.cookingHistory.splice(index, 1);
    recipe.lastCookButtonAction = null;
    await saveRecipes(recipes);
    renderList();
    return;
  }

  if (recipe.cookingHistory.includes(today)) {
    recipe.lastCookButtonAction = { date: today, added: false };
    await saveRecipes(recipes);
    renderList();
    return;
  }

  recipe.cookingHistory.push(today);
  recipe.lastCookButtonAction = { date: today, added: true };
  await saveRecipes(recipes);
  renderList();
}

document.querySelectorAll(".filter-button").forEach(button => {
  button.addEventListener("click", () => {
    activeFilter = button.dataset.filter;
    document.querySelectorAll(".filter-button").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    renderList();
  });
});

document.getElementById("recipeList").addEventListener("click", event => {
  const button = event.target.closest('[data-action="cook"]');
  if (button) cookRecipe(button.dataset.id);
});

renderList();
</script>
