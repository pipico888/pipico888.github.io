<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>なかむら家の旅きろく｜全件バックアップ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf6;color:#60777c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",Meiryo,sans-serif;line-height:1.7}
main{max-width:760px;margin:auto;padding:22px 16px 42px}header{background:#e9f5f6;border-radius:22px;padding:22px 18px;margin-bottom:16px}h1,h2{color:#006c84}h1{font-size:23px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}.panel{background:#fff;border:1px solid #dcebed;border-radius:18px;padding:17px;margin:13px 0}.note{font-size:13px;color:#7d9093}.warning{background:#fff1eb;border-radius:12px;padding:12px;font-size:14px;color:#94695b}button{width:100%;border:0;border-radius:13px;padding:14px 12px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer;background:#006c84;color:white}.secondary{background:#e8f4f5;color:#006c84}button:disabled{opacity:.45}#status{white-space:pre-wrap;background:#f5f8f8;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;min-height:44px}#tripNames{white-space:pre-wrap;max-height:300px;overflow:auto;font-size:13px;background:#f8fbfb;padding:10px;border-radius:10px}iframe{position:absolute;width:1px;height:1px;left:-10000px;border:0}
</style></head><body><main>
<header><h1>なかむら家の旅きろく</h1><div>全件バックアップ（確認用）</div></header>
<section class="panel"><h2>このページについて</h2>
<p>①旅きろく本体HTML内の旅行記録、②ブラウザ保存データ、③削除・予定変換の管理情報をまとめて書き出します。</p>
<div class="warning">元の旅行データは変更・削除しません。まだGoogle連携や復元は行いません。読み取り件数と旅行名を確認してから保存してください。</div>
<p class="note">いつも旅きろくを使っている同じブラウザで開いてください。</p>
<button id="scan">旅行データを読み取って確認</button><div id="status" role="status">準備できています。</div></section>
<section class="panel" id="result" hidden><h2>読み取り結果</h2><div id="tripNames"></div>
<button id="download">全件バックアップJSONをダウンロード</button><button class="secondary" id="show">JSONの内容を表示</button>
<textarea id="json" readonly hidden style="width:100%;height:240px;margin-top:12px"></textarea>
<p class="note">ダウンロード後、iPhoneの「ファイル」アプリで保存を確認してください。可能ならiCloud Driveなどにもう1部コピーしてください。</p></section>
<iframe id="source" title="旅行記録の読み取り用"></iframe></main>
<script>
(()=>{const $=id=>document.getElementById(id);let outputText='';
const parse=(v,f)=>{try{return JSON.parse(v??'')}catch(e){return f}};
function localData(){const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('nakamurake'))keys.push(k)}keys.sort();const values={};keys.forEach(k=>values[k]=localStorage.getItem(k));return{keys,values}}
function readSource(){return new Promise((resolve,reject)=>{const f=$('source');f.onload=()=>{try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d)throw Error('旅きろく本体を読み取れません');const cards=[...d.querySelectorAll('#allTrips .trip:not(.user-trip)')],deleted=parse(localStorage.getItem('nakamurakeDeletedLegacyTrips')||'[]',[]),trips=[];for(const c of cards){const href=c.getAttribute('href')||'',target=href.startsWith('#')?href.slice(1):'';if(!target||deleted.includes('legacy-'+target))continue;if(typeof w.nakamurakeReadLegacyTrip!=='function')throw Error('旅行データ読み取り機能が見つかりません');const t=w.nakamurakeReadLegacyTrip(c);if(t&&t.name)trips.push(t)}resolve(trips)}catch(e){reject(e)}};f.onerror=()=>reject(Error('index.htmlを読み込めません。公開状態を確認してください'));f.src='index.html?backup_read='+Date.now()})}
function merge(a,b){const m=new Map();for(const t of a)m.set(t.legacySection||t.id,{...t,backupSource:'html'});for(const t of b){const key=t.legacySection||(String(t.id||'').startsWith('legacy-')?String(t.id).slice(7):t.id);m.set(key,m.has(key)?{...m.get(key),...t,backupSource:'html+localStorage'}:{...t,backupSource:'localStorage'})}return[...m.values()].sort((x,y)=>String(x.start||'').localeCompare(String(y.start||''))||String(x.name||'').localeCompare(String(y.name||''),'ja'))}
$('scan').addEventListener('click',async()=>{$('scan').disabled=true;$('status').textContent='読み取り中です…';try{const raw=localData(),stored=parse(raw.values.nakamurakeTrips||'[]',[]);if(!Array.isArray(stored))throw Error('ブラウザ保存データの形式が想定外です');const statics=await readSource(),trips=merge(statics,stored),now=new Date();const payload={format:'nakamurake-travel-full-backup',formatVersion:1,createdAt:now.toISOString(),origin:location.origin,description:'index.htmlの静的旅行記録とnakamurake localStorageを照合してまとめたバックアップ。元データは変更していません。',summary:{staticHtmlTrips:statics.length,localStorageTrips:stored.length,mergedTrips:trips.length,localStorageKeys:raw.keys.length,deletedLegacyIds:parse(raw.values.nakamurakeDeletedLegacyTrips||'[]',[]),convertedPlannedIds:parse(raw.values.nakamurakeConvertedPlannedCards||'[]',[])},trips,localStorage:{keys:raw.keys,values:raw.values}};outputText=JSON.stringify(payload,null,2);$('tripNames').textContent='HTML内の旅行：'+statics.length+'件\nブラウザ保存：'+stored.length+'件\n統合後：'+trips.length+'件\n\n'+trips.map((t,i)=>(i+1)+'. '+(t.name||'（名称なし）')+'｜'+(t.start||'日付なし')+(t.status==='planned'?'｜予定':'')).join('\n');$('result').hidden=false;$('json').value=outputText;$('status').textContent='読み取り完了。\nHTML内：'+statics.length+'件\nブラウザ保存：'+stored.length+'件\n統合後：'+trips.length+'件\n\n件数と旅行名を確認してからダウンロードしてください。'}catch(e){$('status').textContent='読み取りに失敗しました：'+e.message+'\n失敗した場合はダウンロードせず、表示を教えてください。'}finally{$('scan').disabled=false}});
$('download').addEventListener('click',()=>{if(!outputText)return;const blob=new Blob([outputText],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');a.href=url;a.download='nakamurake-travel-full-backup-'+stamp+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$('status').textContent+='\nダウンロード操作をしました。「ファイル」アプリで保存を確認してください。'});
$('show').addEventListener('click',()=>{$('json').hidden=!$('json').hidden});})();
</script></body></html>
